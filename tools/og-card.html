<!doctype html>
<!--
  Source for the social share card. Not shipped to the site.
  Regenerate public/og.png with headless Chrome (1200x630):

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
    --headless=new --hide-scrollbars --force-device-scale-factor=1 \
    --window-size=1200,630 --virtual-time-budget=4000 \
    --screenshot=public/og.png \
    "file://$(pwd)/tools/og-card.html"
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: "Be Vietnam Pro", system-ui, sans-serif;
        background: #f7faf4;
        color: #16241b;
        position: relative;
        overflow: hidden;
        padding: 92px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .wash {
        position: absolute;
        right: -150px;
        top: -190px;
        width: 560px;
        height: 560px;
        border-radius: 9999px;
        background: #eaf3e4;
        filter: blur(60px);
        opacity: 0.7;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 16px;
        position: relative;
        color: #2c5f2d;
        font-weight: 600;
        font-size: 21px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .eyebrow .rule {
        display: inline-block;
        width: 46px;
        height: 2px;
        background: #4e9f3d;
      }
      h1 {
        position: relative;
        margin: 26px 0 0;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: 132px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #16241b;
      }
      .tag {
        position: relative;
        margin-top: 32px;
        max-width: 900px;
        font-size: 35px;
        line-height: 1.4;
        color: #16241b;
      }
      .tag b { color: #2c5f2d; font-weight: 600; }
      .foot {
        position: absolute;
        left: 96px;
        bottom: 62px;
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 23px;
        font-weight: 500;
        color: #5d6b58;
      }
      .foot .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #4e9f3d;
      }
    </style>
  </head>
  <body>
    <div class="wash"></div>
    <div class="eyebrow"><span class="rule"></span> Software Engineer</div>
    <h1>Anh Khoi Le</h1>
    <p class="tag">
      Mobile &amp; web products in <b>Flutter</b>, shipped faster with
      <b>AI coding agents</b>.
    </p>
    <div class="foot">
      anhkhoile.vercel.app <span class="dot"></span> github.com/AKaLee-IK27
      <span class="dot"></span> Ho Chi Minh City
    </div>
  </body>
</html>
